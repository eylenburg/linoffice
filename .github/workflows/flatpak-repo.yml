name: Flatpak Repo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Flatpak environment
        run: |
          dbus-uuidgen > /etc/machine-id
          mkdir -p /var/lib/dbus
          ln -sf /etc/machine-id /var/lib/dbus/machine-id
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install PySide BaseApp
        run: |
          flatpak install -y --user flathub io.qt.PySide.BaseApp//6.11

      - name: Fix gpg2 symlink
        run: |
          ln -sf $(which gpg) /usr/local/bin/gpg2 || ln -sf $(which gpg) /usr/bin/gpg2

      - name: Import GPG key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Create Flatpak ref
        run: |
          fpr="${{ steps.gpg.outputs.fingerprint }}"
          test -n "$fpr"
          gpg --export "$fpr" > /tmp/linoffice-public.gpg
          test -s /tmp/linoffice-public.gpg
          key="$(base64 /tmp/linoffice-public.gpg | tr -d '\n')"
          test -n "$key"
          cat > .flatpak/io.github.eylenburg.LinOffice.flatpakref <<EOF
          [Flatpak Ref]
          Name=io.github.eylenburg.LinOffice
          Branch=master
          Title=LinOffice
          Url=https://eylenburg.github.io/linoffice
          RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo
          IsRuntime=false
          GPGKey=${key}
          EOF

      - name: Build Flatpak repository
        uses: andyholmes/flatter@v1
        with:
          files: .flatpak/io.github.eylenburg.LinOffice.yml
          arch: x86_64
          gpg-sign: ${{ steps.gpg.outputs.fingerprint }}
          upload-bundles: true
          upload-pages-artifact: true
          # The previous step writes this file. Flatter copies it to the
          # Pages root by basename:
          # https://eylenburg.github.io/linoffice/io.github.eylenburg.LinOffice.flatpakref
          upload-pages-includes: .flatpak/io.github.eylenburg.LinOffice.flatpakref
          cache-key: flatter-v2

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: io.github.eylenburg.LinOffice-x86_64
          path: bundles

      - name: Attach .flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/*.flatpak

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
