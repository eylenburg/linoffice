name: Publish Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  build-bundle:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Prepare Flatpak environment
        run: |
          dbus-uuidgen > /etc/machine-id
          mkdir -p /var/lib/dbus
          ln -sf /etc/machine-id /var/lib/dbus/machine-id

      - name: Build .flatpak bundle
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --disable-rofiles-fuse \
            --repo=repo build-dir .flatpak/io.github.eylenburg.LinOffice.yml
          flatpak build-bundle repo linoffice.flatpak \
            io.github.eylenburg.LinOffice stable

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: linoffice-x86_64
          path: linoffice.flatpak

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: linoffice.flatpak

  publish:
    needs: build-bundle
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      prebuilt-bundle-artifact: linoffice-{arch}
      arches: x86_64
      signing: gpg
      remote-name: linoffice
      branch: stable
    secrets:
      gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
